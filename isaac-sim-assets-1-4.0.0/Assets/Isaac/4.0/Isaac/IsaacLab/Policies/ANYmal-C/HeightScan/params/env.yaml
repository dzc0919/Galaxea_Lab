decimation: 4
scene:
  num_envs: 4096
  env_spacing: 2.5
  lazy_sensor_update: true
  replicate_physics: false
  terrain:
    cls_name: omni.isaac.orbit.terrains.terrain_importer:TerrainImporter
    collision_group: -1
    prim_path: /World/ground
    num_envs: {}
    terrain_type: generator
    terrain_generator:
      seed: null
      curriculum: false
      size: !!python/tuple [8.0, 8.0]
      border_width: 20.0
      num_rows: 10
      num_cols: 20
      horizontal_scale: 0.1
      vertical_scale: 0.005
      slope_threshold: 0.75
      sub_terrains:
        pyramid_stairs:
          function: omni.isaac.orbit.terrains.trimesh.mesh_terrains:pyramid_stairs_terrain
          proportion: 0.2
          size: {}
          border_width: 1.0
          step_height_range: !!python/tuple &id002 [0.05, 0.23]
          step_width: 0.3
          platform_width: 3.0
          holes: false
        pyramid_stairs_inv:
          function: omni.isaac.orbit.terrains.trimesh.mesh_terrains:inverted_pyramid_stairs_terrain
          proportion: 0.2
          size: {}
          border_width: 1.0
          step_height_range: *id002
          step_width: 0.3
          platform_width: 3.0
          holes: false
        boxes:
          function: omni.isaac.orbit.terrains.trimesh.mesh_terrains:random_grid_terrain
          proportion: 0.2
          size: {}
          grid_width: 0.45
          grid_height_range: !!python/tuple [0.05, 0.2]
          platform_width: 2.0
          holes: false
        random_rough:
          function: omni.isaac.orbit.terrains.height_field.hf_terrains:random_uniform_terrain
          proportion: 0.2
          size: {}
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: null
          noise_range: !!python/tuple [0.02, 0.1]
          noise_step: 0.02
          downsampled_scale: null
        hf_pyramid_slope:
          function: omni.isaac.orbit.terrains.height_field.hf_terrains:pyramid_sloped_terrain
          proportion: 0.1
          size: {}
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: null
          slope_range: !!python/tuple &id003 [0.0, 0.4]
          platform_width: 2.0
          inverted: false
        hf_pyramid_slope_inv:
          function: omni.isaac.orbit.terrains.height_field.hf_terrains:pyramid_sloped_terrain
          proportion: 0.1
          size: {}
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: null
          slope_range: *id003
          platform_width: 2.0
          inverted: true
      difficulty_choices: !!python/tuple [0.5, 0.75, 0.9]
      use_cache: false
      cache_dir: /tmp/orbit/terrains
    usd_path: null
    env_spacing: null
    visual_material:
      func: omni.isaac.orbit.sim.spawner.materials.visual_materials:create_preview_surface
      diffuse_color: !!python/tuple [0.065, 0.0725, 0.08]
      emissive_color: null
      roughness: null
      metallic: null
      opacity: null
    physics_material:
      {
        func: "omni.isaac.orbit.sim.spawner.materials.physics_material:create_rigid_body_material",
        static_friction: 1.0,
        dynamic_friction: 1.0,
        restitution: 0.0,
        improve_patch_friction: true,
        friction_combine_mode: multiply,
        restitution_combine_mode: multiply,
        compliant_contact_stiffness: 0.0,
        compliant_contact_damping: 0.0,
      }
    max_init_terrain_level: 5
  robot:
    prim_path: "{ENV_REGEX_NS}/Robot"
    init_state:
      pos: !!python/tuple [0.0, 0.0, 0.6]
      rot: !!python/tuple [1.0, 0.0, 0.0, 0.0]
      lin_vel: !!python/tuple &id004 [0.0, 0.0, 0.0]
      ang_vel: *id004
      joint_pos:
        { .*HAA: 0.0, .*F_HFE: 0.4, .*H_HFE: -0.4, .*F_KFE: -0.8, .*H_KFE: 0.8 }
      joint_vel: { .*: 0.0 }
    spawn:
      func: omni.isaac.orbit.sim.spawner.spawner:load_usd
      copy_from_source: true
      usd_path: omniverse://localhost/NVIDIA/Assets/Isaac/2022.2.1/Isaac/Robots/ANYbotics/anymal_instanceable.usd
      rigid_props:
        {
          func: "omni.isaac.orbit.sim.schemas.schemas:set_rigid_body_properties",
          rigid_body_enabled: null,
          kinematic_enabled: null,
          disable_gravity: false,
          linear_damping: 0.0,
          angular_damping: 0.0,
          max_linear_velocity: 1000.0,
          max_angular_velocity: 1000.0,
          max_depenetration_velocity: 1.0,
          max_contact_impulse: null,
          enable_gyroscopic_forces: null,
          retain_accelerations: false,
          solver_position_iteration_count: null,
          solver_velocity_iteration_count: null,
          sleep_threshold: null,
          stabilization_threshold: null,
        }
      collision_props:
        {
          func: "omni.isaac.orbit.sim.schemas.schemas:set_collision_properties",
          collision_enabled: null,
          contact_offset: 0.02,
          rest_offset: 0.0,
          torsional_patch_radius: null,
          min_torsional_patch_radius: null,
        }
      articulation_props:
        {
          func: "omni.isaac.orbit.sim.schemas.schemas:set_articulation_root_properties",
          articulation_enabled: null,
          enabled_self_collisions: true,
          solver_position_iteration_count: 4,
          solver_velocity_iteration_count: 0,
          sleep_threshold: null,
          stabilization_threshold: null,
        }
      prepare_contact_sensors: true
    collision_group: 0
    debug_vis: false
    soft_joint_pos_limit_factor: 0.95
    actuators:
      legs:
        cls: omni.isaac.orbit.actuators.actuator_net:ActuatorNetLSTM
        joint_names_expr: [.*HAA, .*HFE, .*KFE]
        effort_limit: 80.0
        velocity_limit: 7.5
        stiffness: null
        damping: null
        saturation_effort: 120.0
        network_file: omniverse://localhost/NVIDIA/Assets/Isaac/2022.2.1/Isaac/Samples/Orbit/ActuatorNets/anydrive_3_lstm_jit.pt
  height_scanner:
    prim_path: "{ENV_REGEX_NS}/Robot/base"
    update_period: 0.02
    history_length: 0
    debug_vis: false
    mesh_prim_paths: [/World/ground]
    offset:
      pos: !!python/tuple [0.0, 0.0, 20.0]
      rot: !!python/tuple [1.0, 0.0, 0.0, 0.0]
    attach_yaw_only: true
    pattern_cfg:
      func: omni.isaac.orbit.sensors.ray_caster.patterns:grid_pattern
      resolution: 0.1
      size: [1.6, 1.0]
      direction: !!python/tuple [0.0, 0.0, -1.0]
    max_distance: 100.0
  contact_forces:
    prim_path: "{ENV_REGEX_NS}/Robot/.*"
    update_period: 0.005
    history_length: 3
    debug_vis: false
    filter_prim_paths_expr: []
episode_length_s: 20.0
