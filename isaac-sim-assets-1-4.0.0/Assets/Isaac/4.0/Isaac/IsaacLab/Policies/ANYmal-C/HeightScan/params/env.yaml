viewer:
  debug_vis: true
  eye: !!python/tuple [7.5, 7.5, 7.5]
  lookat: !!python/tuple [0.0, 0.0, 0.0]
  resolution: !!python/tuple [1280, 720]
sim:
  physics_prim_path: /physicsScene
  dt: 0.005
  substeps: 1
  gravity: !!python/tuple [0.0, 0.0, -9.81]
  enable_scene_query_support: false
  use_flatcache: true
  disable_contact_processing: true
  use_gpu_pipeline: true
  device: cuda:0
  physx:
    {
      use_gpu: true,
      solver_type: 1,
      min_iteration_count: 0,
      max_iteration_count: 255,
      enable_ccd: false,
      enable_stabilization: true,
      bounce_threshold_velocity: 0.5,
      friction_offset_threshold: 0.04,
      friction_correlation_distance: 0.025,
      gpu_max_rigid_contact_count: 8388608,
      gpu_max_rigid_patch_count: 163840,
      gpu_found_lost_pairs_capacity: 2097152,
      gpu_found_lost_aggregate_pairs_capacity: 33554432,
      gpu_total_aggregate_pairs_capacity: 2097152,
      gpu_collision_stack_size: 67108864,
      gpu_heap_capacity: 67108864,
      gpu_temp_buffer_capacity: 16777216,
      gpu_max_num_partitions: 8,
      gpu_max_soft_body_contacts: 1048576,
      gpu_max_particle_contacts: 1048576,
    }
  physics_material:
    {
      func: "omni.isaac.orbit.sim.spawner.materials.physics_material:create_rigid_body_material",
      static_friction: 1.0,
      dynamic_friction: 1.0,
      restitution: 0.0,
      improve_patch_friction: true,
      friction_combine_mode: multiply,
      restitution_combine_mode: multiply,
      compliant_contact_stiffness: 0.0,
      compliant_contact_damping: 0.0,
    }
commands:
  resampling_time_range: !!python/tuple [20.0, 20.0]
  debug_vis: false
  robot_attr: robot
  heading_command: true
  rel_standing_envs: 0.02
  rel_heading_envs: 1.0
  ranges:
    lin_vel_x: !!python/tuple &id001 [-1.0, 1.0]
    lin_vel_y: *id001
    ang_vel_z: *id001
    heading: !!python/tuple [-3.141592653589793, 3.141592653589793]
  class_name: UniformVelocityCommandGenerator
actions:
